name: replay-v4-postrepair

on:
  pull_request:
    paths:
      - 'benchmarks/replay_v4/**'
      - 'results/replay_v4/**'
      - 'docs/research/replay_v4/**'
      - 'tests/test_replay_v4_instrument.py'
      - '.github/workflows/replay-v4-postrepair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - run: python -m compileall -q cerberus sdk simulator tests benchmarks
      - run: python benchmarks/replay_v4/run.py --verify-inputs-only
      - name: Run post-repair tests without relabeling the historical instrument
        run: python -m pytest -q --ignore=benchmarks/replay_v3/test_instrument.py
      - name: Run the historical v3 instrument on its unchanged historical tree
        run: |
          git worktree add --detach "$RUNNER_TEMP/v3-history" f0ebd38c58e9d40af35d35c5cc32b5614eb60439
          cd "$RUNNER_TEMP/v3-history"
          python -m pytest -q benchmarks/replay_v3/test_instrument.py
      - run: python -m cerberus.evaluation enforcement-demo --json
      - run: python benchmarks/release_candidate/run.py --target . --output "$RUNNER_TEMP/release-candidate.json" --fail-on-violation
      - run: python -m build && python scripts/release_checksums.py
      - name: Verify installed wheel separately
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install dist/cerberus_cyber_eval-0.1.0rc1-py3-none-any.whl
          "$RUNNER_TEMP/installed/bin/python" -m pip check
          "$RUNNER_TEMP/installed/bin/python" -I scripts/verify_installed.py --repo-root "$GITHUB_WORKSPACE"
      # Full 5+20 timing is run locally and retained as versioned evidence.
      # CI validates the instrument and frozen inputs, not a timing claim.
