name: readiness-evidence

on:
  pull_request:
    paths:
      - 'docs/evaluation/readiness-2026-11-21-v1/**'
      - 'results/readiness_2026-11-21/**'
      - 'scripts/verify_readiness_evidence.py'
      - '.github/workflows/readiness-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_readiness_evidence.py
      - run: python benchmarks/replay_v4/restore_local_commits.py
      - name: Preserve invalid predecessor and verify both complete passing runs
        run: |
          python benchmarks/replay_v4/verify_results.py results/replay_v4/pr19_2026-11-11
          python benchmarks/replay_v4/verify_results.py results/replay_v4/pr19_2026-11-11_v2 --require-pass
          python benchmarks/replay_v4/verify_results.py results/readiness_2026-11-21/v4_fresh --require-pass
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          first = Path('results/replay_v4/pr19_2026-11-11/results.json.gz')
          assert json.loads(gzip.decompress(first.read_bytes()))['gate'] == 'INVALID_MEASUREMENT'
          PY
