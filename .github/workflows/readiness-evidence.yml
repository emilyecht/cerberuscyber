name: readiness-evidence

on:
  pull_request:
    paths:
      - 'docs/evaluation/readiness-2026-11-21-v1/**'
      - 'results/readiness_2026-11-21/**'
      - 'scripts/verify_readiness_evidence.py'
      - '.github/workflows/readiness-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/verify_v4_history.sh
