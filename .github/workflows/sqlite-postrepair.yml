name: sqlite-postrepair

on:
  pull_request:
    paths:
      - 'cerberus/state.py'
      - 'cerberus/enforcement.py'
      - 'tests/test_sqlite_review_followups.py'
      - '.github/workflows/sqlite-postrepair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - run: python -m compileall -q cerberus sdk simulator tests benchmarks
      - name: Validate repaired source without rewriting historical pins
        run: python -m pytest -q --ignore=benchmarks/replay_v3/test_instrument.py
      - name: Validate historical instrument on its historical source
        run: |
          git worktree add --detach "$RUNNER_TEMP/v3-history" f0ebd38c58e9d40af35d35c5cc32b5614eb60439
          cd "$RUNNER_TEMP/v3-history"
          python -m pytest -q benchmarks/replay_v3/test_instrument.py
      - run: python -m cerberus.evaluation enforcement-demo --json
      - run: python benchmarks/release_candidate/run.py --target . --output "$RUNNER_TEMP/release-candidate.json" --fail-on-violation
